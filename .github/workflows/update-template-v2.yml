name: 🔁 Auto update
run-name: "Automated update of ${{ github.ref_name }} by @${{ github.actor }}"

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  find-autoupdates:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      pkgs: ${{ steps.collect.outputs.pkgs }}
    steps:
      - uses: actions/checkout@v6

      - uses: dcarbone/install-jq-action@v3.2.0

      - name: Find autoupdate scripts
        id: collect
        run: |
          updates=$(find srcpkgs -mindepth 2 -maxdepth 2 -type f -name update.sh)
          if [ -z "$updates" ]; then
            printf "matrix=[]\npkgs=[]\n" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while read path; do
            dir=$(dirname "$path")
            pkg=$(basename "$dir")
            printf '{"dir":"%s","name":"%s","path":"%s"}\n' "$dir" "$pkg" "$path"
          done <<< "${updates}" | jq -cs > matrix.json

          jq -c 'map(.name)' matrix.json > pkgs.json

          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "pkgs=$(cat pkgs.json)" >> "$GITHUB_OUTPUT"

  update-versions:
    name: update ${{ matrix.pkg.name }}
    runs-on: ubuntu-latest
    needs: find-autoupdates
    if: ${{ needs.find-autoupdates.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJson(needs.find-autoupdates.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PULL_PUSH }}

      - uses: dcarbone/install-jq-action@v3.2.0

      - name: Run update script
        run: bash "${{ matrix.pkg.path }}"
        env:
          GH_TOKEN: ${{ secrets.PULL_PUSH }}
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: updated-pkg-${{ matrix.pkg.name }}
          path: ${{ matrix.pkg.dir }}

  create-prs:
    runs-on: ubuntu-latest
    needs: update-versions
    if: always()
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PULL_PUSH }}
          fetch-depth: 0

      - name: Download all updated packages
        uses: actions/download-artifact@v8
        with:
          path: ./srcpkgs

      - name: Check for changes and create PRs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Найти изменённые шаблоны
          changed_files=$(git diff --name-only | grep 'srcpkgs/.*/template$' || true)
          if [ -z "$changed_files" ]; then
            echo "No changes detected. Skipping PR creation."
            exit 0
          fi

          # Создать ветку и коммит
          branch_name="auto-update-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $branch_name
          git add .
          git commit -m "chore: automated update of packages" || exit 0

          # Запушить ветку
          git push origin $branch_name

          # Создать пул-реквест
          gh pr create \
            --title "🔄 Автоматическое обновление пакетов" \
            --body "Этот PR создан автоматически. Обнаружены обновления для:\n$(echo "$changed_files" | sed 's/^/- /')" \
            --head $branch_name \
            --base main

        env:
          GITHUB_TOKEN: ${{ secrets.PULL_PUSH }}
